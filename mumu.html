<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video AI China | Dr. Pinguin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:system-ui,sans-serif}a{color:#ff9000;text-decoration:none}
header{position:sticky;top:0;z-index:20;height:48px;background:#000;border-bottom:2px solid #ff9000;display:flex;align-items:center}
.nav{width:min(1100px,100%);margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900}.brand b{color:#ff9000}
.back{font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;color:#ddd;padding:8px 10px;border-radius:999px}
.wrap{width:min(980px,100%);margin:0 auto;padding:18px 12px 40px}
h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}h1 span{color:#ff9000}.meta{color:#888;font-size:12px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr;gap:18px}}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden}
.frame{position:relative;aspect-ratio:9/16;max-height:72vh;width:min(100%,calc(72vh * 9 / 16));margin:0 auto;background:#000}
@media(min-width:900px){.frame{aspect-ratio:16/9;max-height:none;width:100%}}
.frame iframe,.frame img.poster{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;object-fit:cover}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2)}
.play span{width:56px;height:56px;border-radius:999px;background:rgba(255,144,0,.95);color:#000;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.info{padding:10px 12px}.info strong{display:block;color:#eee;font-size:14px;margin-bottom:6px}
.info .row{display:flex;gap:8px}.btn{flex:1;text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;border-radius:8px;padding:8px 6px;color:#ddd}
.btn.primary{background:#ff9000;color:#000;border-color:#ff9000}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.pager a,.pager span{min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:8px;color:#ddd;font-weight:800;font-size:13px}


#sharePanel{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
#sharePanel.on{display:flex}
#sharePanel .sh-box{width:min(520px,100%);background:#111;border:1px solid #333;border-radius:16px 16px 0 0;padding:14px 14px 22px;position:relative}
#sharePanel .sh-t{font-weight:800;margin-bottom:12px}
#sharePanel .sh-x{position:absolute;top:10px;right:10px;border:0;background:#2a2a2a;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700}
#sharePanel .sh-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sharePanel .sh-a{display:block;text-align:center;border:1px solid #333;border-radius:10px;padding:12px 8px;color:#eee;font-weight:800;font-size:13px;background:#1a1a1a}

#ov{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);padding:12px;overflow:hidden;touch-action:none;-webkit-overflow-scrolling:auto}body.ov-lock{overflow:hidden;position:fixed;width:100%;height:100%;touch-action:none}
#ov.on{display:flex;flex-direction:column;align-items:center;justify-content:center}
#ov .box{width:min(960px,100%);background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
#ov .hd{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #222}
#ov .hd b{font-size:13px;line-height:1.3}
#ov .x{border:0;background:#ff9000;color:#000;font-weight:900;border-radius:8px;padding:8px 12px;cursor:pointer}
#ov .ph{position:relative;width:100%;aspect-ratio:16/9;background:#000}
#ov.tall .ph{aspect-ratio:9/16;max-height:78vh;width:min(100%,calc(78vh * 9 / 16));margin:0 auto}
#ov .ph iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.pager .on{background:#ff9000;color:#000;border-color:#ff9000}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/">DR.<b>PINGUIN</b></a><a class="back" href="/">Kembali</a></div></header>
<div class="wrap">
  <h1>Video <span>AI China</span></h1>
  <p class="meta" id="count">Memuat...</p>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</div>
<div id="ov"></div>
<script>
(function(){
  var PER = 4;
  function codeOf(v){
    var u = String(v.embed || v.direct || '');
    var m = u.match(/\/(?:e|v)\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }
  function titleOf(v){ return String(v.title || 'Video').replace(/[<>]/g,'').replace(/_/g,' ').trim(); }
  function embedOf(v){
    var id = codeOf(v);
    var raw = String(v.embed || v.direct || '');
    if (id && /mumu\.watch/i.test(raw)) return 'https://mumu.watch/e/' + id;
    return raw.replace('/v/', '/e/');
  }
  function sourceOf(v){
    var id = codeOf(v);
    var raw = String(v.direct || v.embed || '');
    if (id && /mumu\.watch/i.test(raw)) return 'https://mumu.watch/v/' + id;
    return raw || '#';
  }
  function pageNow(){ var n = parseInt((location.hash.match(/p(\d+)/)||[])[1] || '1', 10); return n > 0 ? n : 1; }
  function mountIframe(frame){
    if (!frame || frame.getAttribute('data-loaded')) return;
    var src = frame.getAttribute('data-src');
    if (!src) return;
    frame.setAttribute('data-loaded', '1');
    frame.innerHTML = '<iframe src="'+src+'" allow="autoplay;fullscreen;encrypted-media" allowfullscreen referrerpolicy="origin"></iframe>';
  }
  function watchFrames(){
    var frames = document.querySelectorAll('.frame[data-src]');
    if (!('IntersectionObserver' in window)) {
      frames.forEach(mountIframe);
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) {
          mountIframe(en.target);
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: '180px 0px' });
    frames.forEach(function(f){ io.observe(f); });
  }
  fetch('/data/mumu.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(items){
    window._mumu = items || [];
    draw();
  });
  function draw(){
    var items = window._mumu || [];
    var pages = Math.max(1, Math.ceil(items.length / PER));
    var p = Math.min(pageNow(), pages);
    var slice = items.slice((p-1)*PER, p*PER);
    document.getElementById('count').textContent = items.length + ' video \u00b7 halaman ' + p + ' / ' + pages;
    document.getElementById('grid').innerHTML = slice.map(function(v){
      var id = codeOf(v);
      return '<article class="card" data-id="'+id+'" data-src="'+embedOf(v)+'" data-title="'+titleOf(v).replace(/"/g,'')+'"><div class="frame" data-src="'+embedOf(v)+'"><div class="play"><span>\u25b6</span></div></div><div class="info"><strong>'+titleOf(v)+'</strong><div class="row"><button type="button" class="btn primary openv">Putar</button><button type="button" class="btn sharev">Share</button><a class="btn" href="'+sourceOf(v)+'" target="_blank" rel="noopener">Sumber</a></div></div></article>';
    }).join('') || '<p>Belum ada video.</p>';
    var html = '';
    if (p > 1) html += '<a href="#p'+(p-1)+'">Prev</a>';
    for (var i=1;i<=pages;i++) html += i===p ? '<span class="on">'+i+'</span>' : '<a href="#p'+i+'">'+i+'</a>';
    if (p < pages) html += '<a href="#p'+(p+1)+'">Next</a>';
    document.getElementById('pager').innerHTML = html;
    watchFrames();
    document.querySelectorAll('.openv,.card .play').forEach(function(el){
      el.onclick = function(ev){
        ev.preventDefault();
        var card = el.closest('.card');
        openOv(card.getAttribute('data-title'), card.getAttribute('data-src'), true, card.getAttribute('data-id'));
      };
    });
    document.querySelectorAll('.sharev').forEach(function(el){
      el.onclick = function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var card = el.closest('.card');
        shareLink(card.getAttribute('data-title'), card.getAttribute('data-id'));
      };
    });
    window.scrollTo(0,0);
  }
  
  


  function shareLink(title, id){
    var url = "https://koleksidrpinguin.com/v/" + encodeURIComponent(id || "");
    var text = (title || "Video") + "
" + url;
    var enc = encodeURIComponent(text);
    var uenc = encodeURIComponent(url);
    var panel = document.getElementById("sharePanel");
    if (!panel) {
      panel = document.createElement("div");
      panel.id = "sharePanel";
      document.body.appendChild(panel);
    }
    panel.innerHTML = '<div class="sh-box"><div class="sh-t">Share this video</div><button type="button" class="sh-x" id="shClose">Close</button><div class="sh-row">'
      + '<a class="sh-a" target="_blank" rel="noopener" href="https://wa.me/?text=' + enc + '">WhatsApp</a>'
      + '<a class="sh-a" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + uenc + '&text=' + encodeURIComponent(title || "") + '">Telegram</a>'
      + '<a class="sh-a" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + uenc + '">Facebook</a>'
      + '<a class="sh-a" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=' + enc + '">X</a>'
      + '<button type="button" class="sh-a" id="shCopy">Salin link</button>'
      + '<button type="button" class="sh-a" id="shNative">Share HP</button>'
      + '</div></div>';
    panel.className = "on";
    panel.onclick = function(e){ if (e.target === panel) panel.className = ""; };
    document.getElementById("shClose").onclick = function(){ panel.className = ""; };
    document.getElementById("shCopy").onclick = function(){
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
      document.getElementById("shCopy").textContent = "Tersalin";
    };
    document.getElementById("shNative").onclick = function(){
      if (navigator.share) navigator.share({ title: title, text: text, url: url }).catch(function(){});
    };
  }


  var ov = document.getElementById('ov');
  function closeOv(){
    ov.className = '';
    ov.innerHTML = '';
    document.body.classList.remove('ov-lock');
    if (window._ovY != null) { window.scrollTo(0, window._ovY); window._ovY = null; }
  }
  function openOv(title, src, tall, id){
    window._ovY = window.scrollY || 0;
    document.body.classList.add('ov-lock');
    ov.className = 'on' + (tall ? ' tall' : '');
    ov.innerHTML = '<div class="box"><div class="hd"><b></b><div><button type="button" class="x" id="ovshare">Share</button> <button type="button" class="x" id="ovx">Tutup</button></div></div><div class="ph"><iframe src="" allow="autoplay;fullscreen;encrypted-media" allowfullscreen referrerpolicy="origin"></iframe></div></div>';
    ov.querySelector('b').textContent = title;
    ov.querySelector('iframe').src = src;
    ov.querySelector('#ovx').onclick = closeOv;
    ov.querySelector('#ovshare').onclick = function(){ shareLink(title, id || ''); };
  }
  ov.addEventListener('click', function(e){ if (e.target === ov) closeOv(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeOv(); });

  window.addEventListener('hashchange', draw);
})();
</script>
</body>
</html>

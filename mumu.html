<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video AI China | Dr. Pinguin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:system-ui,sans-serif}a{color:#ff9000;text-decoration:none}
header{position:sticky;top:0;z-index:20;height:48px;background:#000;border-bottom:2px solid #ff9000;display:flex;align-items:center}
.nav{width:min(1100px,100%);margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900}.brand b{color:#ff9000}
.back{font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;color:#ddd;padding:8px 10px;border-radius:999px}
.wrap{width:min(1100px,100%);margin:0 auto;padding:18px 12px 40px}
h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}h1 span{color:#ff9000}.meta{color:#888;font-size:12px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr;gap:18px}}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden}
.frame{position:relative;aspect-ratio:16/9;background:#000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.info{padding:10px 12px}.info strong{display:block;color:#eee;font-size:14px;margin-bottom:6px}
.info .row{display:flex;gap:8px}.btn{flex:1;text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;border-radius:8px;padding:8px 6px;color:#ddd}
.btn.primary{background:#ff9000;color:#000;border-color:#ff9000}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.pager a,.pager span{min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:8px;color:#ddd;font-weight:800;font-size:13px}
.pager .on{background:#ff9000;color:#000;border-color:#ff9000}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/">DR.<b>PINGUIN</b></a><a class="back" href="/">Kembali</a></div></header>
<div class="wrap">
  <h1>Video <span>AI China</span></h1>
  <p class="meta" id="count">Memuat...</p>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</div>
<script>
(function(){
  var PER = 6;
  function codeOf(v){
    var u = String(v.embed || v.direct || '');
    var m = u.match(/\/(?:e|v)\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }
  function titleOf(v){ return String(v.title || 'Video').replace(/[<>]/g,'').replace(/_/g,' ').trim(); }
  function embedOf(v){
    var id = codeOf(v);
    var raw = String(v.embed || v.direct || '');
    if (id && /mumu\.watch/i.test(raw)) return 'https://mumu.watch/e/' + id;
    if (id) return raw.replace('/v/', '/e/');
    return raw.replace('/v/', '/e/');
  }
  function sourceOf(v){
    var id = codeOf(v);
    var raw = String(v.direct || v.embed || '');
    if (id && /mumu\.watch/i.test(raw)) return 'https://mumu.watch/v/' + id;
    return raw || '#';
  }
  function pageNow(){ var n = parseInt((location.hash.match(/p(\d+)/)||[])[1] || '1', 10); return n > 0 ? n : 1; }
  fetch('/data/mumu.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(items){
    window._mumu = items || [];
    draw();
  });
  function draw(){
    var items = window._mumu || [];
    var pages = Math.max(1, Math.ceil(items.length / PER));
    var p = Math.min(pageNow(), pages);
    var slice = items.slice((p-1)*PER, p*PER);
    document.getElementById('count').textContent = items.length + ' video \u00b7 halaman ' + p + ' / ' + pages;
    document.getElementById('grid').innerHTML = slice.map(function(v){
      var id = codeOf(v);
      return '<article class="card"><div class="frame"><iframe src="'+embedOf(v)+'" allow="autoplay;fullscreen;encrypted-media" allowfullscreen referrerpolicy="origin" loading="lazy"></iframe></div><div class="info"><strong>'+titleOf(v)+'</strong><div class="row"><a class="btn primary" href="/v/'+encodeURIComponent(id)+'">Halaman video</a><a class="btn" href="'+sourceOf(v)+'" target="_blank" rel="noopener">Sumber</a></div></div></article>';
    }).join('') || '<p>Belum ada video.</p>';
    var html = '';
    if (p > 1) html += '<a href="#p'+(p-1)+'">Prev</a>';
    for (var i=1;i<=pages;i++) html += i===p ? '<span class="on">'+i+'</span>' : '<a href="#p'+i+'">'+i+'</a>';
    if (p < pages) html += '<a href="#p'+(p+1)+'">Next</a>';
    document.getElementById('pager').innerHTML = html;
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', draw);
})();
</script>
</body>
</html>

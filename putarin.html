<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putarin | Dr. Pinguin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;height:48px;background:#000;border-bottom:2px solid #ff9000;display:flex;align-items:center}
.nav{width:min(1500px,100%);margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.02em}.brand b{color:#ff9000}
.back{font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;color:#ddd;padding:8px 10px;border-radius:999px}
.wrap{width:min(1500px,100%);margin:0 auto;padding:18px 12px 40px}
h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
h1 span{color:#ff9000}.meta{color:#888;font-size:12px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{display:block;background:#111;border:1px solid #222;border-radius:12px;overflow:hidden}
.card:hover{border-color:#ff9000}
.thumb{height:160px;background:#0b0b0b;display:flex;align-items:center;justify-content:center;color:#ff9000;font-size:28px}
.info{padding:10px 12px}.info strong{display:block;font-size:14px;line-height:1.35}.info small{color:#888}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="/">DR.<b>PINGUIN</b></a>
    <a class="back" href="/">Kembali ke halaman utama</a>
  </div>
</header>
<div class="wrap">
  <h1>Putarin <span>Video</span></h1>
  <p class="meta" id="count">Memuat...</p>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
  function codeOf(v){
    var u = String(v.embed || v.direct || '');
    var m = u.match(/\/(?:e|v)\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }
  function titleOf(v){
    return String(v.title || 'Video').replace(/[<>]/g,'').replace(/_/g,' ').trim();
  }
  fetch('/data/putarin.json?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(items){
      items = items || [];
      document.getElementById('count').textContent = items.length + ' video · klik kartu = 1 halaman 1 video';
      document.getElementById('grid').innerHTML = items.map(function(v){
        var id = codeOf(v);
        return '<a class="card" href="/v/' + encodeURIComponent(id) + '"><div class="thumb">▶</div><div class="info"><strong>' + titleOf(v) + '</strong><small>Buka halaman video</small></div></a>';
      }).join('') || '<p>Belum ada video.</p>';
    })
    .catch(function(){
      document.getElementById('count').textContent = 'Gagal memuat daftar.';
    });
})();
</script>
</body>
</html>

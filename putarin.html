<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putarin | Dr. Pinguin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:system-ui,sans-serif}a{color:#ff9000;text-decoration:none}
header{position:sticky;top:0;z-index:20;height:48px;background:#000;border-bottom:2px solid #ff9000;display:flex;align-items:center}
.nav{width:min(1100px,100%);margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900}.brand b{color:#ff9000}
.back{font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;color:#ddd;padding:8px 10px;border-radius:999px}
.wrap{width:min(1100px,100%);margin:0 auto;padding:18px 12px 40px}
h1{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}h1 span{color:#ff9000}.meta{color:#888;font-size:12px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{border:1px solid #333;background:#161616;color:#ddd;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer}
.chip.on{background:#ff9000;color:#000;border-color:#ff9000}
.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#111;border:1px solid #222;border-radius:12px;overflow:hidden}
.frame{position:relative;aspect-ratio:16/9;background:#000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.info{padding:10px 12px}.info strong{display:block;color:#eee;font-size:14px;margin-bottom:6px}
.info .row{display:flex;gap:8px}.btn{flex:1;text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid #333;border-radius:8px;padding:8px 6px;color:#ddd}
.btn.primary{background:#ff9000;color:#000;border-color:#ff9000}
.pager{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.pager a,.pager span{min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:8px;color:#ddd;font-weight:800;font-size:13px}
.pager .on{background:#ff9000;color:#000;border-color:#ff9000}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/">DR.<b>PINGUIN</b></a><a class="back" href="/">Kembali ke halaman utama</a></div></header>
<div class="wrap">
  <h1>Putarin <span>Video</span></h1>
  <p class="meta" id="count">Memuat...</p>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="pager" id="pager"></div>
</div>
<script>
(function(){
  var PER = 6;
  var CATS = ['AI','Film','Series','Anime','Musik','Gaming','Edukasi','JAV','Lainnya'];
  function folderOf(v){ return String(v.folder || 'Lainnya'); }
  function codeOf(v){
    var u = String(v.embed || v.direct || '');
    var m = u.match(/\/(?:e|v)\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }
  function titleOf(v){ return String(v.title || 'Video').replace(/[<>]/g,'').replace(/_/g,' ').trim(); }
  function embedOf(v){ return String(v.embed || v.direct || '').replace('/v/', '/e/'); }
  function pageNow(){ var n = parseInt((location.hash.match(/p(\d+)/)||[])[1] || '1', 10); return n > 0 ? n : 1; }
  function catNow(){
    var m = location.hash.match(/c=([^&]+)/);
    if (m) return decodeURIComponent(m[1]);
    return 'AI';
  }
  function setHash(cat, page){ location.hash = 'c=' + encodeURIComponent(cat) + '&p' + page; }
  fetch('/data/putarin.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(items){
    window._put = items || [];
    var cat = catNow();
    var n = (window._put||[]).filter(function(v){ return folderOf(v)===cat; }).length;
    if (!n) {
      for (var i=0;i<CATS.length;i++) {
        if ((window._put||[]).some(function(v){ return folderOf(v)===CATS[i]; })) { setHash(CATS[i], 1); return; }
      }
    }
    draw();
  });
  function filtered(){
    var cat = catNow();
    return (window._put || []).filter(function(v){ return folderOf(v) === cat; });
  }
  function draw(){
    var cat = catNow();
    var items = filtered();
    var pages = Math.max(1, Math.ceil(items.length / PER));
    var p = Math.min(pageNow(), pages);
    var slice = items.slice((p-1)*PER, p*PER);
    document.getElementById('count').textContent = cat + ' · ' + items.length + ' video · halaman ' + p + ' / ' + pages;
    document.getElementById('chips').innerHTML = CATS.map(function(c){
      var n = (window._put||[]).filter(function(v){ return folderOf(v)===c; }).length;
      if (!n && c !== cat) return '';
      return '<button class="chip'+(c===cat?' on':'')+'" data-cat="'+c+'">'+c+' '+n+'</button>';
    }).join('');
    document.querySelectorAll('.chip').forEach(function(btn){
      btn.onclick = function(){ setHash(btn.getAttribute('data-cat'), 1); };
    });
    document.getElementById('grid').innerHTML = slice.map(function(v){
      var id = codeOf(v); var src = embedOf(v);
      return '<article class="card"><div class="frame"><iframe src="'+src+'" allow="autoplay;fullscreen;encrypted-media" allowfullscreen referrerpolicy="origin"></iframe></div><div class="info"><strong>'+titleOf(v)+'</strong><div class="row"><a class="btn primary" href="/v/'+encodeURIComponent(id)+'">Halaman video</a><a class="btn" href="'+src+'" target="_blank" rel="noopener">Sumber</a></div></div></article>';
    }).join('') || '<p>Kosong di kategori ini.</p>';
    var html = '';
    if (p > 1) html += '<a href="#c='+encodeURIComponent(cat)+'&p'+(p-1)+'">Prev</a>';
    for (var i=1;i<=pages;i++) html += i===p ? '<span class="on">'+i+'</span>' : '<a href="#c='+encodeURIComponent(cat)+'&p'+i+'">'+i+'</a>';
    if (p < pages) html += '<a href="#c='+encodeURIComponent(cat)+'&p'+(p+1)+'">Next</a>';
    document.getElementById('pager').innerHTML = html;
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', draw);
})();
</script>
</body>
</html>

name: health
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/health-check.mjs
      - .github/workflows/health.yml
      - js/app.js
      - js/modal-share.js
      - data/posters.json
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ping production
        run: node scripts/health-check.mjs
      - name: buka issue kalau rusak
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --label health --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then echo "issue #$existing already open"; exit 0; fi
          gh issue create --title "Web production gagal health check" --label health --body "Health check gagal. Cek Actions health terbaru lalu: 1) buka koleksidrpinguin.com 2) cek /js/app.js /data/videos.json /data/posters.json 3) jangan rebase posters.json ke teks rusak."

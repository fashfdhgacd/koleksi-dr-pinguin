name: backfill-posters
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Berapa ID per jalan"
        default: "400"
        required: false
permissions:
  contents: write
  actions: write
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: backfill
        env:
          POSTER_BATCH: ${{ github.event.inputs.batch || '400' }}
          POSTER_CONCUR: "5"
        run: node scripts/backfill-posters.mjs
      - name: commit
        run: |
          git config user.name "dr-pinguin-bot"
          git config user.email "readmi559@gmail.com"
          git add data/posters.json
          if git diff --cached --quiet; then echo "no change"; echo "MORE=0" >> "$GITHUB_ENV"; exit 0; fi
          git commit -m "posters: isi batch IndoAV/userbokep"
          git pull --rebase origin main
          git push
          echo "MORE=1" >> "$GITHUB_ENV"
      - name: next batch
        if: env.MORE == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run backfill-posters.yml --ref main -f batch=400

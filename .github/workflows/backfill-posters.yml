name: backfill-posters
on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Berapa ID per jalan"
        default: "250"
        required: false
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: backfill
        env:
          POSTER_BATCH: ${{ github.event.inputs.batch || '250' }}
          POSTER_CONCUR: "4"
        run: node scripts/backfill-posters.mjs
      - name: commit
        run: |
          git config user.name "dr-pinguin-bot"
          git config user.email "readmi559@gmail.com"
          git add data/posters.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "posters: isi batch IndoAV/userbokep"
          git push

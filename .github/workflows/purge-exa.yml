name: purge-exa
on:
  push:
    paths:
      - scripts/purge-exa.mjs
      - .github/workflows/purge-exa.yml
      - scripts/PURGE_EXA
  workflow_dispatch:
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/purge-exa.mjs
      - name: commit
        run: |
          git config user.name "dr-pinguin-bot"
          git config user.email "readmi559@gmail.com"
          git add data/videos.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "purge: hapus semua ExaStream/Vicek"
          git push
